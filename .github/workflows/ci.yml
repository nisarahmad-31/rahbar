name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.8 mypy==1.15.0 -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check api indexer eval corpus

      - name: Run Mypy Type Checker
        run: |
          cd api && mypy app
          cd ../indexer && mypy pipeline

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5 pytest-cov -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Unit Tests with Coverage Gate (>= 60%)
        run: |
          cd api && pytest --cov=app --cov-fail-under=60 -q
          cd ../indexer && pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Install Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -schema-location default -summary

  build:
    needs: [lint, test, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          tags: rahbar-api:${{ github.sha }}

      - name: Build Indexer image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: false
          tags: rahbar-indexer:${{ github.sha }}

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: false
          tags: rahbar-ui:${{ github.sha }}

  scan:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local images for scanning
        run: |
          docker build -t rahbar-api:scan api
          docker build -t rahbar-indexer:scan indexer
          docker build -t rahbar-ui:scan ui

      - name: Install Trivy
        run: |
          TRIVY_VER="0.76.2"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" | tar -xz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy

      - name: Scan images with Trivy
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --format table rahbar-api:scan
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --format table rahbar-indexer:scan
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --format table rahbar-ui:scan

  e2e-eval:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: |
          pip install httpx pyyaml pydantic

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-ci

      - name: Build and load local images into kind
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui
          kind load docker-image rahbar-api:dev --name rahbar-ci
          kind load docker-image rahbar-indexer:dev --name rahbar-ci
          kind load docker-image rahbar-ui:dev --name rahbar-ci

      - name: Apply Kubernetes manifests and CI fixture corpus
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create configmap rahbar-corpus --from-file=eval/fixtures -n rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="ci-key" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/dev
          kubectl patch configmap rahbar-config -n rahbar --type merge -p '{"data":{"LLM_PROVIDER":"stub","RELEVANCE_FLOOR":"0.15"}}'

      - name: Wait for data tier and run indexer Job on CI fixtures
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          kubectl delete job indexer -n rahbar --ignore-not-found
          kubectl create job indexer --from=cronjob/reindex -n rahbar
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s

      - name: Wait for API and UI rollout status
        run: |
          kubectl rollout restart deployment/api -n rahbar
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Run eval gate against live stack
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/readyz
          python eval/run_eval.py --api http://127.0.0.1:8000 --golden eval/fixtures/golden.fixture.yaml --baseline /tmp/no-baseline.json --out /tmp/e2e-results.json

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n rahbar || true
          kubectl describe pods -n rahbar || true
          kubectl logs job/indexer -n rahbar || true
          kubectl logs -l app.kubernetes.io/name=chroma -n rahbar --tail=50 || true
          kubectl logs -l app.kubernetes.io/name=api -n rahbar --tail=50 || true
