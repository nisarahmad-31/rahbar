name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5 pytest-cov -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Unit Tests
        run: |
          cd api && pytest -q
          cd ../indexer && pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry and Target Image Prefix
        id: reg
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "use_dockerhub=true" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            echo "use_dockerhub=false" >> $GITHUB_OUTPUT
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "image_prefix=ghcr.io/${REPO_OWNER}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.reg.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.reg.outputs.use_dockerhub != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-prod

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/prod
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="prod-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Update deployment image to commit SHA
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}"
          else
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${REPO_OWNER}/rahbar-api:${{ github.sha }}"
          fi
          kubectl set image deployment/api api=${IMAGE} -n rahbar || true

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s || true

      - name: Ingress smoke test
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 5
          curl -f http://127.0.0.1:8000/healthz || exit 0
