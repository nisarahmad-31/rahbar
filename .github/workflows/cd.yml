name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5 pytest-cov -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Unit Tests
        run: |
          cd api && pytest -q
          cd ../indexer && pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry and Target Image Prefix
        id: reg
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "use_dockerhub=true" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            echo "use_dockerhub=false" >> $GITHUB_OUTPUT
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "image_prefix=ghcr.io/${REPO_OWNER}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.reg.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.reg.outputs.use_dockerhub != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ steps.reg.outputs.image_prefix }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-prod

      - name: Pull published SHA images and load into kind
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            PREFIX="${{ secrets.DOCKERHUB_USERNAME }}"
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            PREFIX="ghcr.io/${REPO_OWNER}"
          fi
          docker pull "${PREFIX}/rahbar-api:${{ github.sha }}"
          docker pull "${PREFIX}/rahbar-indexer:${{ github.sha }}"
          docker pull "${PREFIX}/rahbar-ui:${{ github.sha }}"
          kind load docker-image "${PREFIX}/rahbar-api:${{ github.sha }}" --name rahbar-prod
          kind load docker-image "${PREFIX}/rahbar-indexer:${{ github.sha }}" --name rahbar-prod
          kind load docker-image "${PREFIX}/rahbar-ui:${{ github.sha }}" --name rahbar-prod
          echo "IMAGE_PREFIX=${PREFIX}" >> $GITHUB_ENV

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create configmap rahbar-corpus --from-file=eval/fixtures -n rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="prod-key" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/prod
          kubectl patch configmap rahbar-config -n rahbar --type merge -p '{"data":{"LLM_PROVIDER":"stub","RELEVANCE_FLOOR":"0.15"}}'

      - name: Update workload images to commit SHA and index corpus
        run: |
          kubectl set image deployment/api api="${IMAGE_PREFIX}/rahbar-api:${{ github.sha }}" -n rahbar
          kubectl set image deployment/ui ui="${IMAGE_PREFIX}/rahbar-ui:${{ github.sha }}" -n rahbar
          kubectl set image cronjob/reindex indexer="${IMAGE_PREFIX}/rahbar-indexer:${{ github.sha }}" -n rahbar
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          kubectl delete job indexer -n rahbar --ignore-not-found
          kubectl create job indexer --from=cronjob/reindex -n rahbar
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Live API and Ingress object smoke test
        run: |
          kubectl get ingress rahbar-ingress -n rahbar
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf http://127.0.0.1:8000/readyz
          curl -sf -X POST http://127.0.0.1:8000/api/ask -H "Content-Type: application/json" -d '{"question":"When is a student placed on academic warning?"}'
