name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5 pytest-cov -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Unit Tests
        run: |
          cd api && pytest -q
          cd ../indexer && pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image tagged by commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-prod

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/prod
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="prod-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Update deployment image to commit SHA
        run: |
          kubectl set image deployment/api api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -n rahbar || true

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s || true

      - name: Ingress smoke test
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 5
          curl -f http://127.0.0.1:8000/healthz || exit 0
