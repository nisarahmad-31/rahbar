apiVersion: batch/v1
kind: Job
metadata:
  name: eval-gate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: eval-gate
    app.kubernetes.io/component: evaluation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval-gate
        app.kubernetes.io/component: evaluation
    spec:
      serviceAccountName: rahbar-api
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        fsGroup: 10003
      initContainers:
        - name: init-eval-results
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /results && chown -R 10003:10003 /results"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: eval-results
              mountPath: /results
      containers:
        - name: evaluator
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              NOISE_FLAG=""
              if [ "${EVAL_SKIP_NOISE}" = "true" ]; then
                NOISE_FLAG="--skip-noise"
              fi
              python /app/eval/run_part_b.py \
                --api "${TARGET_API_URL}" \
                --golden /app/eval/golden.jsonl \
                --module /app/eval/results/module_embedding_eval.json \
                --results-dir /results \
                --human-labels /app/eval/faithfulness_human_labels.json \
                --runs "${EVAL_RUNS}" \
                --stratified-limit "${EVAL_STRATIFIED_LIMIT}" \
                --label "${EVAL_LABEL}" \
                ${NOISE_FLAG}
              if [ "${EVAL_MODE}" = "candidate" ]; then
                python /app/eval/release_gate.py \
                  --baseline /results/part_b_baseline_latest.json \
                  --candidate "/results/part_b_${EVAL_LABEL}_latest.json" \
                  --config /etc/gate/gate_config.json \
                  --out "/results/gate_${EVAL_LABEL}_latest.json"
              fi
          envFrom:
            - configMapRef:
                name: rahbar-gate-config
          env:
            - name: HOME
              value: "/tmp"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: eval-results
              mountPath: /results
            - name: gate-config
              mountPath: /etc/gate
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: eval-results
          persistentVolumeClaim:
            claimName: rahbar-eval-pvc
        - name: gate-config
          configMap:
            name: rahbar-gate-config
            items:
              - key: gate_config.json
                path: gate_config.json
