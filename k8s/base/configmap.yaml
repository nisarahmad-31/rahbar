apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"
  EMBED_MODEL: "nomic-embed-text"
  EMBED_MODEL_VERSION: "latest"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  COLLECTION_VERSION: "v1"
  TOP_K: "5"
  TEMPERATURE: "0.2"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.docker.internal:11434"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  RELEVANCE_FLOOR: "0.65"
  CACHE_THRESHOLD: "0.88"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  TRACE_LOG_PATH: "/traces/traces.jsonl"
  TRACE_STDOUT: "true"
  CORPUS_DIR: "/corpus"
  DATA_LAKE_DIR: "/data/lake"
  QUARANTINE_DIR: "/data/quarantine"
  ARCHIVE_DIR: "/data/archive"
  VERIFICATION_REPORT_DIR: "/data/reports"
  QUARANTINE_MODE: "copy"
  NEAR_DUP_THRESHOLD: "0.85"
