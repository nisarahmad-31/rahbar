apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-candidate-config
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api-candidate
    app.kubernetes.io/component: candidate
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"
  EMBED_MODEL: "nomic-embed-text"
  EMBED_MODEL_VERSION: "latest"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar_candidate"
  COLLECTION_VERSION: "candidate_topk3"
  TOP_K: "3"
  TEMPERATURE: "0.2"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.docker.internal:11434"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  RELEVANCE_FLOOR: "0.65"
  CACHE_THRESHOLD: "1.1"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  TRACE_LOG_PATH: "/traces/candidate_traces.jsonl"
  TRACE_STDOUT: "true"
  CORPUS_DIR: "/corpus"
  DATA_LAKE_DIR: "/data/candidate_lake"
  QUARANTINE_DIR: "/data/candidate_quarantine"
  ARCHIVE_DIR: "/data/candidate_archive"
  VERIFICATION_REPORT_DIR: "/data/candidate_reports"
  QUARANTINE_MODE: "copy"
  NEAR_DUP_THRESHOLD: "0.85"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/component: candidate-indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/component: candidate-indexer
    spec:
      serviceAccountName: rahbar-indexer
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
      initContainers:
        - name: init-candidate-lake
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/candidate_lake /data/candidate_quarantine /data/candidate_archive /data/candidate_reports && chown -R 10002:10002 /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: data-lake
              mountPath: /data
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args:
            - "--batch-name"
            - "candidate-ingest"
            - "--incremental-mode"
            - "merge"
          env:
            - name: HOME
              value: "/tmp"
          envFrom:
            - configMapRef:
                name: rahbar-candidate-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-lake
              mountPath: /data
            - name: corpus
              mountPath: /corpus
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-lake
          persistentVolumeClaim:
            claimName: rahbar-data-pvc
        - name: corpus
          configMap:
            name: rahbar-corpus
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api-candidate
    app.kubernetes.io/component: candidate-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-candidate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-candidate
        app.kubernetes.io/component: candidate-backend
    spec:
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: init-traces-dir
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /traces && chown -R 10001:10001 /traces"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: traces
              mountPath: /traces
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-candidate-config
          env:
            - name: HOME
              value: "/tmp"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: traces
              mountPath: /traces
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: traces
          persistentVolumeClaim:
            claimName: rahbar-traces-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api-candidate
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: api-candidate
